<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Energy Price Monitor</title>
  <meta name="description" content="Τρέχουσες τιμές χονδρικής αγοράς ρεύματος για την Ελλάδα, σήμερα και αύριο — από το ENTSO-E Transparency Platform.">
  <link rel="preconnect" href="https://mlwzujsjdrsuyxbkpevy.supabase.co">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="app-header__title">
        <span class="app-header__icon" aria-hidden="true">⚡</span>
        <div>
          <h1>Energy Price Monitor</h1>
          <p class="app-header__subtitle">Τιμές χονδρικής αγοράς ρεύματος Ελλάδας</p>
        </div>
      </div>
      <button id="refresh-button" class="icon-button" type="button" aria-label="Ανανέωση τιμών" title="Ανανέωση">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
          <polyline points="21 3 21 9 15 9"></polyline>
        </svg>
      </button>
    </header>

    <nav class="tabs" role="tablist" aria-label="Επιλογή ημέρας">
      <button class="tab is-active" data-day="today" role="tab" aria-selected="true" id="tab-today">Σήμερα</button>
      <button class="tab" data-day="tomorrow" role="tab" aria-selected="false" id="tab-tomorrow">Αύριο</button>
    </nav>

    <main id="content" role="tabpanel" aria-live="polite">
      <!-- Το περιεχόμενο (φόρτωση / σφάλμα / δεδομένα) γεμίζει δυναμικά από το script.js -->
    </main>

    <footer class="app-footer">
      <p>Πηγή: <a href="https://transparency.entsoe.eu/" target="_blank" rel="noopener noreferrer">ENTSO-E Transparency Platform</a> (CC BY 4.0)</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
